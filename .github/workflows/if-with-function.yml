
name: Nice if example

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'

jobs:
  quality_checks:
    if: startsWith(github.ref_name, 'feature') && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Perform code quality
        run: |
          echo "Perform quality_checks on the code"
          exit 1

  dev_deploy:
    if: github.ref_name == 'develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dev deploy
        run: echo "Deploying the code to development environment"

  prod_deploy:
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Prod deploy
        run: echo "Deploying the code to production environment"

  success_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Success notification
        run: echo "Success notification sent to the team"

  failure_notify:
    needs: [quality_checks, dev_deploy, prod_deploy]
    if: always() && needs.quality_checks.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Failure notification
        run: echo "Failure notification sent to the team"
