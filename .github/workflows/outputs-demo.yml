name: Outputs Demo

on: push

jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Step One
        id: step1
        run: |
          echo "Step 1 is running"
          echo "version=0.0.1" >> "$GITHUB_OUTPUT"

      - name: Step Two
        run: |
          echo "Step 2 is running"
          echo "This version is ${{ steps.step1.outputs.version }}"
